name: CI/CD Pipeline - Crime Prediction App

# ===================================================================
# Trigger Configuration:
# - Automatically triggers when commits are pushed to 'main'
# - Also supports manual testing via the GitHub Actions UI tab
# ===================================================================
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CICD_PIPELINE_GUIDE.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # Stage 1: Continuous Integration (Test & Validate on GitHub Runner)
  # -----------------------------------------------------------------
  ci-build-and-test:
    name: 1. CI - Validate Code & Build Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verify Code Syntax and Compilation
        run: |
          python -m py_compile app.py
          if [ -f "train_model.py" ]; then python -m py_compile train_model.py; fi
          echo "Python syntax validation passed successfully!"

      - name: 5. Build Docker Image Locally in GitHub Runner
        run: |
          docker build -t crime-prediction-app:latest .
          echo "Docker image built successfully! Containerization verified."

  # -----------------------------------------------------------------
  # Stage 2: Continuous Deployment (SSH into AWS EC2 and Auto-Update)
  # -----------------------------------------------------------------
  cd-deploy-to-ec2:
    name: 2. CD - Auto-Deploy to AWS EC2
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Connect to EC2 via SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting Automated Deployment on AWS EC2 ==="
            cd /opt/app/crime_app/BE_PROJECT_GC14

            echo "1. Pulling latest code from GitHub..."
            git pull origin main

            echo "2. Rebuilding Docker image..."
            docker build -t crime-prediction-app:latest .

            echo "3. Restarting application container..."
            docker stop crime-app || true
            docker rm crime-app || true
            docker run -d -p 5000:5000 --name crime-app --restart unless-stopped crime-prediction-app:latest

            echo "4. Cleaning up dangling images..."
            docker image prune -f

            echo "=== Zero-Touch Deployment Succeeded! Application is Live ==="
