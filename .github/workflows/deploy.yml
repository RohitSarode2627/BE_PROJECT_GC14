name: Deploy to Amazon ECS - Crime Prediction App

# ===================================================================
# Triggers on code push to 'main'
# Builds Docker image on GitHub runner, pushes to AWS ECR, and deploys to AWS ECS
# ===================================================================
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CICD_PIPELINE_GUIDE.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: crime-prediction-app
  ECS_CLUSTER: crime-app-cluster
  ECS_SERVICE: crime-app-service
  ECS_TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: crime-prediction-container

jobs:
  # -----------------------------------------------------------------
  # Stage 1: Continuous Integration (Code Quality & Compilation)
  # -----------------------------------------------------------------
  ci-validate:
    name: 1. CI - Validate Code & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verify Code Syntax and Compilation
        run: |
          python -m py_compile app.py
          if [ -f "train_model.py" ]; then python -m py_compile train_model.py; fi
          echo "Python syntax validation passed successfully!"

  # -----------------------------------------------------------------
  # Stage 2: Build, Push to Amazon ECR & Deploy to Amazon ECS
  # -----------------------------------------------------------------
  deploy-to-ecs:
    name: 2. CD - Push to AWS ECR & Deploy to AWS ECS
    needs: ci-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Push both commit SHA tag and 'latest' tag to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Output image URI for ECS task definition
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 5. Render New Image into Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: 6. Deploy New Task Definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
