name: CI Pipeline - Crime Prediction App (No Cloud Required)

# ===================================================================
# Trigger Configuration:
# - Automatically triggers when commits are pushed to 'main'
# - Also supports manual testing via the GitHub Actions UI tab
# ===================================================================
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CICD_PIPELINE_GUIDE.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # Continuous Integration (Runs entirely on GitHub-hosted runners for free)
  # No AWS, no cloud subscription, and no credit card required.
  # -----------------------------------------------------------------
  ci-build-and-test:
    name: Test Code & Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verify Code Syntax and Compilation
        run: |
          python -m py_compile app.py train_model.py
          echo "Python syntax validation passed successfully!"

      - name: 5. Build Docker Image Locally in GitHub Runner
        run: |
          docker build -t crime-prediction-app:latest .
          echo "Docker image built successfully! Containerization verified."

      - name: 6. Test Running the Container
        run: |
          # Start container in detached mode
          docker run -d -p 5000:5000 --name test-container crime-prediction-app:latest
          
          # Allow 5 seconds for Flask to initialize
          sleep 5
          
          # Verify container is alive and listening
          docker ps
          
          # Clean up test container
          docker stop test-container
          docker rm test-container
          echo "Container startup test passed successfully!"

