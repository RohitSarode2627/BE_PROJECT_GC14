services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: crime-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crime
    ports:
      # Mapped to 3307 on host to avoid conflict with native Windows MySQL on 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically initializes schema and data on first startup
      - ./crime.sql:/docker-entrypoint-initdb.d/crime.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # Flask Web Application Service
  # -------------------------------------------------------------
  web:
    build: .
    container_name: crime-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Connects directly to the 'db' container service over Docker bridge network
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/crime
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
